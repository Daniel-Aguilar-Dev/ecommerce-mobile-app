spring.application.name=ecommerce-api

# Copy this file to application.properties for a local setup, or define these
# environment variables in your deployment environment.
spring.datasource.url=jdbc:mysql://localhost:3306/nombre_db?useSSL=false&serverTimezone=UTC

spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development defaults. Review ddl-auto before using this against production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=PEGA_AQUI_LA_CLAVE_BASE64_GENERADA
app.jwt.expiration-ms=43200000

# Variables de cloudinary (NO SUBIRLAS A GITHUB HDLV)
cloudinary.cloud-name=CLOUDINARY_CLOUD_NAME
cloudinary.api-key=CLOUDINARY_API_KEY
cloudinary.api-secret=CLOUDINARY_API_SECRET

# Reestricción de tamaños en formularios multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB