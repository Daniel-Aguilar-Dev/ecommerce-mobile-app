spring.application.name=ecommerce-api

# Copy this file to application.properties for a local setup, or define these
# environment variables in your deployment environment.
spring.datasource.url=jdbc:mysql://localhost:3306/nombre_db?useSSL=false&serverTimezone=UTC

spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development defaults. Review ddl-auto before using this against production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs


app.jwt.secret=PEGA_AQUI_LA_CLAVE_BASE64_GENERADA
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=2592000000
